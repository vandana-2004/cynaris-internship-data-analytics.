# Data Contract: Sales Dataset

dataContractSpecification: "0.9.3"

id: sales-orders-v1

info:
  title: Sales Dataset Contract
  version: "1.0"
  owner: Data Analytics
  producer: "Data Analytics Intern"
  consumer: "BI Dashboard"
  description: "Defines the schema, quality requirements, privacy controls, and change management rules for the sales dataset."

dataset:
  path: python-pandas/sales_data.csv
  format: CSV
  required_fields:
    - order_id
    - customer
    - region
    - category
    - sales
    - quantity

quality_rules:
  - field: order_id
    requirements:
      - required
      - unique
  - field: customer
    requirements:
      - required
      - not_blank
  - field: region
    requirements:
      - required
      - not_blank
  - field: category
    requirements:
      - required
      - not_blank
  - field: sales
    requirements:
      - numeric
      - minimum: 0
  - field: quantity
    requirements:
      - numeric
      - minimum_exclusive: 0

service_level:
  freshness_target: "To be agreed with the BI dashboard consumer"
  monitoring: "Validate data before using it in reporting"

privacy:
  - field: customer
    classification: "Potential personal data"
    protection:
      - "Restrict access to authorised users"
      - "Mask customer identifiers in reports when identity is not needed"
      - "Use pseudonymisation or tokenisation when appropriate"
    note: "Confirm the actual contents of the customer field and applicable privacy requirements before final classification."

change_management:
  owner: Data Analytics
  process: "Notify the BI dashboard consumer of schema or quality-rule changes and validate the dataset before release."
