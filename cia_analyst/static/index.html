<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIA Data Analyst</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px 16px;
        font-family: Arial, sans-serif;
        background: #f3f5f9;
        color: #202938;
      }

      main {
        max-width: 950px;
        margin: auto;
      }

      h1 {
        margin-bottom: 8px;
      }
      .subtitle {
        color: #64748b;
        margin-bottom: 28px;
      }

      section {
        background: white;
        padding: 22px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 10px #0000000d;
      }

      h2 {
        font-size: 19px;
        margin-top: 0;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
      }

      textarea {
        min-height: 85px;
        resize: vertical;
      }

      button {
        padding: 11px 18px;
        margin: 5px 5px 5px 0;
        border: 0;
        border-radius: 7px;
        background: #2457d6;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button.secondary {
        background: #64748b;
      }

      #status {
        margin: 12px 0;
        color: #475569;
      }
      #answer {
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
      }

      th {
        background: #f1f5f9;
      }

      .chart-container {
        position: relative;
        height: 320px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CIA Data Analyst Mode</h1>
      <p class="subtitle">
        Upload a CSV, ask questions, and explore your data.
      </p>

      <section>
        <h2>1. Upload CSV</h2>
        <input type="file" id="csvFile" accept=".csv,text/csv" />
        <button id="uploadBtn" onclick="uploadCSV()">Upload CSV</button>
        <button class="secondary" onclick="clearSession()">
          Clear session
        </button>
        <p id="status">No dataset uploaded yet.</p>
      </section>

      <section id="previewSection" class="hidden">
        <h2>2. Data preview</h2>
        <div class="table-wrap">
          <table id="previewTable"></table>
        </div>
      </section>

      <section id="querySection" class="hidden">
        <h2>3. Ask CIA</h2>
        <textarea
          id="question"
          placeholder="Example: Show total sales by region as a dataframe"
        ></textarea>
        <button id="queryBtn" onclick="askQuestion()">Run analysis</button>
      </section>

      <section id="answerSection" class="hidden">
        <h2>4. Analysis result</h2>
        <p id="answer"></p>
      </section>

      <section id="chartSection" class="hidden">
        <h2>5. Chart</h2>
        <div class="chart-container">
          <canvas id="resultChart"></canvas>
        </div>
      </section>
    </main>

    <script>
      let sessionId = null;
      let chartInstance = null;

      const statusElement = document.getElementById("status");

      function setLoading(buttonId, loading, label) {
        const button = document.getElementById(buttonId);
        button.disabled = loading;
        button.textContent = loading ? "Please wait..." : label;
      }

      function showPreview(columns, rows) {
        const table = document.getElementById("previewTable");
        table.replaceChildren();

        const header = document.createElement("tr");

        columns.forEach((column) => {
          const th = document.createElement("th");
          th.textContent = column;
          header.appendChild(th);
        });

        table.appendChild(header);

        rows.forEach((row) => {
          const tr = document.createElement("tr");

          columns.forEach((column) => {
            const td = document.createElement("td");
            td.textContent = row[column] ?? "";
            tr.appendChild(td);
          });

          table.appendChild(tr);
        });

        document.getElementById("previewSection").classList.remove("hidden");
      }

      async function uploadCSV() {
        const file = document.getElementById("csvFile").files[0];

        if (!file) {
          statusElement.textContent = "Please select a CSV file.";
          return;
        }

        if (!file.name.toLowerCase().endsWith(".csv")) {
          statusElement.textContent = "Please select a CSV file.";
          return;
        }

        setLoading("uploadBtn", true, "Upload CSV");

        try {
          const formData = new FormData();
          formData.append("file", file);

          const response = await fetch("/cia/upload", {
            method: "POST",
            body: formData,
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.detail || "Upload failed.");
          }

          sessionId = result.session_id;
          showPreview(result.columns, result.preview);

          document.getElementById("querySection").classList.remove("hidden");
          document.getElementById("answerSection").classList.add("hidden");
          document.getElementById("chartSection").classList.add("hidden");

          if (chartInstance) {
            chartInstance.destroy();
            chartInstance = null;
          }

          statusElement.textContent = "Uploaded successfully: " + file.name;
        } catch (error) {
          statusElement.textContent = error.message;
        } finally {
          setLoading("uploadBtn", false, "Upload CSV");
        }
      }

      async function askQuestion() {
        const question = document.getElementById("question").value.trim();

        if (!sessionId) {
          statusElement.textContent = "Upload a CSV first.";
          return;
        }

        if (!question) {
          statusElement.textContent = "Please enter a question.";
          return;
        }

        setLoading("queryBtn", true, "Run analysis");

        try {
          const response = await fetch("/cia/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: sessionId,
              question: question,
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.detail || "Analysis failed.");
          }

          document.getElementById("answer").textContent =
            result.answer ?? "No answer returned.";

          document.getElementById("answerSection").classList.remove("hidden");

          renderChart(result.chartjs);
          statusElement.textContent = "Analysis completed.";
        } catch (error) {
          statusElement.textContent = error.message;
        } finally {
          setLoading("queryBtn", false, "Run analysis");
        }
      }

      function renderChart(chartData) {
        const section = document.getElementById("chartSection");

        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }

        if (!chartData) {
          section.classList.add("hidden");
          return;
        }

        section.classList.remove("hidden");

        const context = document.getElementById("resultChart").getContext("2d");

        chartInstance = new Chart(context, {
          type: chartData.type || "bar",
          data: chartData.data,
          options: chartData.options || {
            responsive: true,
            maintainAspectRatio: false,
          },
        });
      }

      async function clearSession() {
        if (sessionId) {
          try {
            const response = await fetch(
              "/cia/session/" + encodeURIComponent(sessionId),
              { method: "DELETE" },
            );

            if (!response.ok) {
              throw new Error("Could not clear the server session.");
            }
          } catch (error) {
            statusElement.textContent = error.message;
            return;
          }
        }

        sessionId = null;

        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }

        document.getElementById("csvFile").value = "";
        document.getElementById("question").value = "";
        document.getElementById("previewTable").replaceChildren();

        [
          "previewSection",
          "querySection",
          "answerSection",
          "chartSection",
        ].forEach((id) => document.getElementById(id).classList.add("hidden"));

        statusElement.textContent = "Session cleared.";
      }
    </script>
  </body>
</html>
